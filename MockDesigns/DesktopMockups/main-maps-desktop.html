<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EventSphere — Map (Desktop)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root {
    --bg: #F4502F;
    --black: #000000;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --muted: #6B7280;
    --accent: #2F80ED;
    --accent-light: #E3F0FF;
    --yellow: #FFD400;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .topbar {
    background: var(--black);
    padding: 20px 48px;
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .logo {
    color: var(--white);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 1px;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .search {
    flex: 1;
    max-width: 640px;
    display: flex;
    align-items: center;
    background: var(--white);
    border-radius: 999px;
    padding: 10px 18px;
    gap: 10px;
  }
  .search input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 14px;
    background: transparent;
  }
  .icon-btn {
    font-size: 18px;
    color: var(--muted);
  }

  .nav-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .nav-actions button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--white);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    position: relative;
  }
  .nav-actions button.profile {
    background: var(--accent);
  }
  .nav-actions .dot {
    position: absolute;
    top: 6px;
    right: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--black);
  }

  .map-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 82px);
    overflow: hidden;
  }
  .map-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="main-maps-desktop.html">EVENTSPHERE</a>
    <div class="search">
      <i class="bi bi-search icon-btn"></i>
      <input type="text" placeholder="Search events, hosts, locations..." disabled>
    </div>
    <div class="nav-actions">
      <button aria-label="Notifications">
        <i class="bi bi-bell"></i>
        <span class="dot"></span>
      </button>
      <button aria-label="Messages">
        <i class="bi bi-chat-dots"></i>
      </button>
      <button class="profile" aria-label="Profile">
        <i class="bi bi-person-fill"></i>
      </button>
    </div>
  </div>

  <div class="map-wrap">
    <img src="assets/map-area.png" alt="Map view of nearby events">
  </div>

</body>
</html>
