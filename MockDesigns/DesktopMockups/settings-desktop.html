<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EventSphere — Settings (Desktop)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root {
    --bg: #F4502F;
    --black: #000000;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --muted: #6B7280;
    --accent: #2F80ED;
    --accent-light: #E3F0FF;
    --yellow: #FFD400;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    background: var(--black);
    padding: 20px 48px;
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .logo {
    color: var(--white);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 1px;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .search {
    flex: 1;
    max-width: 640px;
    display: flex;
    align-items: center;
    background: var(--white);
    border-radius: 999px;
    padding: 10px 18px;
    gap: 10px;
  }
  .search input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 14px;
    background: transparent;
  }
  .icon-btn { font-size: 18px; color: var(--muted); }

  .nav-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .nav-actions button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--white);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    position: relative;
  }
  .nav-actions button.profile { background: var(--accent); }
  .nav-actions .dot {
    position: absolute;
    top: 6px;
    right: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--black);
  }

  .page-wrap {
    max-width: 860px;
    margin: 40px auto 80px;
    padding: 0 32px;
  }

  .settings-card {
    background: var(--white);
    border-radius: 18px;
    padding: 32px 36px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  }
  .settings-card h1 {
    font-size: 28px;
    margin: 0 0 16px;
  }
  .section-heading {
    font-size: 16px;
    font-weight: 800;
    margin: 28px 0 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-heading:first-of-type { margin-top: 8px; }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    color: var(--text);
  }
  .setting-row .chev { color: var(--muted); }

  .toggle {
    width: 46px;
    height: 26px;
    border-radius: 999px;
    background: var(--accent);
    position: relative;
    flex-shrink: 0;
  }
  .toggle .knob {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--white);
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="main-maps-desktop.html">EVENTSPHERE</a>
    <div class="search">
      <i class="bi bi-search icon-btn"></i>
      <input type="text" placeholder="Search events, hosts, locations..." disabled>
      <i class="bi bi-sliders icon-btn"></i>
    </div>
    <div class="nav-actions">
      <button aria-label="Notifications">
        <i class="bi bi-bell"></i>
        <span class="dot"></span>
      </button>
      <button aria-label="Messages">
        <i class="bi bi-chat-dots"></i>
      </button>
      <button class="profile" aria-label="Profile">
        <i class="bi bi-person-fill"></i>
      </button>
    </div>
  </div>

  <div class="page-wrap">
    <div class="settings-card">
      <h1>Settings</h1>

      <div class="section-heading">Account Settings</div>
      <div class="setting-row">
        <span>Username: Ava Chen</span>
        <i class="bi bi-chevron-right chev"></i>
      </div>
      <div class="setting-row">
        <span>Password: &bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
        <i class="bi bi-chevron-right chev"></i>
      </div>
      <div class="setting-row">
        <span>Email: ava.chen@example.com</span>
        <i class="bi bi-chevron-right chev"></i>
      </div>
      <div class="setting-row">
        <span>Name: Ava Chen</span>
        <i class="bi bi-chevron-right chev"></i>
      </div>

      <div class="section-heading">Accessibility Settings</div>
      <div class="setting-row">
        <span>Night Mode</span>
        <div class="toggle"><div class="knob"></div></div>
      </div>
    </div>
  </div>

</body>
</html>
